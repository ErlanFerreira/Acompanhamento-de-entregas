name: Migrar do banco antigo

# Copia os dados do banco antigo (secret ANTIGO_DATABASE_URL) pro principal e
# pro separado (scripts/migrar_banco_antigo.py). Rodar à mão, com o banco
# antigo no ar; pode rodar de novo sem duplicar nada.
on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Só contar o que tem no banco antigo (não grava nada)"
        type: boolean
        default: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/migrar_banco_antigo.py ${{ inputs.simular && '--simular' || '' }}
        env:
          ANTIGO_DATABASE_URL: ${{ secrets.ANTIGO_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONSULTAS_DATABASE_URL: ${{ secrets.CONSULTAS_DATABASE_URL }}
