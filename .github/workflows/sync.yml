name: Sincronizar pendências

on:
  # Agendamento automático PAUSADO em 2026-09-11 -- o portal GW está
  # recusando login da automação (HTTP 401) desde 09/09, provavelmente
  # bloqueio contra o IP dos runners do GitHub Actions. Aguardando retorno
  # do suporte da GW antes de reativar (ver mensagem enviada ao suporte).
  # Pra reativar: descomentar o bloco `schedule` abaixo.
  # schedule:
  #   # Horários em UTC -- correspondem a 06:10, 11:10, 15:10 e 19:10 no
  #   # horário de Brasília (UTC-3, sem horário de verão desde 2019).
  #   - cron: "10 9,14,18,22 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-sync.txt

      - run: python -m playwright install --with-deps chromium

      - run: python scripts/run_sync.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          SYNC_WINDOW_DAYS: "90"
