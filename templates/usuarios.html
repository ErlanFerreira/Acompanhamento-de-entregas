{% extends "base.html" %}
{% block title %}Gestão de Usuários — Transrota{% endblock %}
{% block content %}
<div class="viz-root">
  <header class="app-header">
    <div>
      <h1>Gestão de Usuários</h1>
      <p>Crie, edite ou remova acessos ao painel.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button">🌓 Alternar tema</button>
  </header>

  <section class="table-section">
    <div class="table-toolbar">
      <h2>Usuários</h2>
      <span class="count" id="users-count"></span>
      <div style="flex:1"></div>
      <button class="btn" id="btn-novo">+ Novo usuário</button>
    </div>
    <div class="table-scroll">
      <table class="detail" id="users-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Papel</th>
            <th>Criado em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </section>
</div>

<div id="user-modal" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <h3 id="modal-title">Novo usuário</h3>
    <input type="hidden" id="u-id">
    <label>Nome<input type="text" id="u-nome"></label>
    <label>E-mail<input type="email" id="u-email"></label>
    <label>Senha <span class="hint" id="senha-hint"></span><input type="password" id="u-senha"></label>
    <label>Papel
      <select id="u-role">
        <option value="user">Usuário</option>
        <option value="admin">Admin</option>
      </select>
    </label>
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel" type="button">Cancelar</button>
      <button class="btn-primary" id="modal-save" type="button">Salvar</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/usuarios.js"></script>
{% endblock %}
